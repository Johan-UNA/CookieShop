<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/createOrder.css">
</head>
<body>

<div class="container mt-4">
    <!-- Lista de productos -->
    <div id="productList" class="row"></div>

    <div class="d-flex align-items-start mt-4">
        <!-- Tabla de la orden -->
        <div class="order me-4">
            <div id="orderContainer" class="table-responsive"></div>
        </div>

        <!-- Formulario de la orden -->
        <div id="formContainer"></div>

        <!-- Mensaje de confirmación de la orden -->
        <div id="orderMessage" class="mt-3"></div>
    </div>
</div>



<!-- Archivos JavaScript -->
<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/navBar.js"></script>
<script src="../js/createOrder.js"></script>
</body>
</html>
