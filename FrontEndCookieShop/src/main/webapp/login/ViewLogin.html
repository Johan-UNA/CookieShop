<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" id="usuario" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        <div id="errorMessage" class="text-danger mt-3"></div>
    </form>

    <div class="form-footer">
        <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='ViewRegister.html?type=usuario'">Registro Usuario</button>
        <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='ViewRegister.html?type=cliente'">Registro Cliente</button>
    </div>
</div>

<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/login.js"></script>
<script src="../js/navBar.js"></script>

</body>
</html>
